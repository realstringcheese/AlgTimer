<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONO // Cubing Timer</title>
  <style>
    /* =========================================================
       THEME & CUSTOMIZATION VARIABLES (Edit anything here!)
       ========================================================= */
    :root {
      --bg-primary: #0a0a0a;
      --bg-surface: #121212;
      --bg-elevated: #1c1c1c;
      --border-color: #2a2a2a;
      --border-strong: #404040;

      --text-primary: #f5f5f5;
      --text-secondary: #999999;
      --text-muted: #5c5c5c;

      --state-idle: var(--text-primary);
      --state-holding: #666666;
      --state-ready: #ffffff;
      --state-running: var(--text-primary);

      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
      --timer-size: 7.5rem;
      --scramble-size: 1.35rem;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .hidden {
      display: none !important;
    }

    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* Focus Mode while timer is running */
    .app.is-running .sidebar,
    .app.is-running .top-bar,
    .app.is-running .last-solve-actions,
    .app.is-running .timer-hint {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar,
    .top-bar,
    .last-solve-actions,
    .timer-hint {
      transition: opacity 0.12s ease;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      gap: 1.25rem;
      min-height: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.95rem;
    }

    .brand-muted {
      color: var(--text-muted);
    }

    .select {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.4rem 0.65rem;
      font-size: 0.875rem;
      cursor: pointer;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .stat-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.65rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    .stat-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* History */
    .history-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .history-actions {
      display: flex;
      gap: 0.75rem;
    }

    .solve-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      margin-top: 0.5rem;
      padding-right: 0.25rem;
    }

    .solve-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
    }

    .solve-item:hover {
      background: var(--bg-elevated);
    }

    .solve-index {
      color: var(--text-muted);
      font-size: 0.78rem;
      min-width: 2.2rem;
    }

    .solve-time {
      flex: 1;
    }

    .solve-item-actions {
      display: flex;
      gap: 0.25rem;
      opacity: 0;
    }

    .solve-item:hover .solve-item-actions {
      opacity: 1;
    }

    .mini-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 4px;
      font-size: 0.7rem;
      padding: 0.1rem 0.35rem;
      cursor: pointer;
    }

    .mini-btn:hover,
    .mini-btn.active {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }

    /* Main Stage */
    .main-stage {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 1.5rem 2rem 1rem;
      gap: 1rem;
    }

    .scramble-wrapper {
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .scramble-text {
      font-family: var(--font-mono);
      font-size: var(--scramble-size);
      line-height: 1.5;
      max-width: 820px;
      letter-spacing: 0.02em;
      user-select: text;
    }

    .scramble-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .scramble-status {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Timer Zone */
    .timer-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      cursor: pointer;
      padding: 2rem;
      gap: 1rem;
    }

    .timer-display {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.5rem, var(--timer-size), 14rem);
      font-weight: 700;
      line-height: 1;
      color: var(--state-idle);
      transition: color 0.06s linear, transform 0.08s ease;
    }

    .timer-zone[data-state="holding"] .timer-display {
      color: var(--state-holding);
    }

    .timer-zone[data-state="ready"] .timer-display {
      color: var(--state-ready);
      transform: scale(1.03);
    }

    .timer-zone[data-state="running"] .timer-display {
      color: var(--state-running);
    }

    .timer-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .timer-zone[data-state="ready"] .timer-hint {
      color: var(--state-ready);
    }

    .last-solve-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    /* Buttons */
    .btn-text {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .btn-text:hover {
      color: var(--text-primary);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.4rem 0.8rem;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-outline:hover,
    .btn-outline.active {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }

    .btn-pill {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      cursor: pointer;
    }

    .btn-pill:hover,
    .btn-pill.active {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }

    .btn-icon {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      width: 36px;
      height: 36px;
      font-size: 1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .btn-icon:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* Modals */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: grid;
      place-items: center;
      padding: 1rem;
      z-index: 50;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .divider {
      height: 1px;
      background: var(--border-color);
    }

    .full-width {
      width: 100%;
    }

    .muted-text {
      color: var(--text-secondary);
      font-size: 0.82rem;
    }

    .solve-modal-scramble {
      font-family: var(--font-mono);
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.75rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .main-stage {
        order: 1;
        min-height: 65vh;
      }

      .sidebar {
        order: 2;
        border-right: none;
        border-top: 1px solid var(--border-color);
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="brand">MONO<span class="brand-muted">//TIMER</span></div>
        <select id="event-select" class="select" aria-label="WCA Event">
          <option value="333">3x3x3</option>
          <option value="222">2x2x2</option>
          <option value="444">4x4x4</option>
          <option value="555">5x5x5</option>
          <option value="666">6x6x6</option>
          <option value="777">7x7x7</option>
          <option value="333oh">3x3x3 OH</option>
          <option value="333bf">3x3x3 BLD</option>
          <option value="pyram">Pyraminx</option>
          <option value="skewb">Skewb</option>
          <option value="sq1">Square-1</option>
          <option value="clock">Clock</option>
          <option value="minx">Megaminx</option>
        </select>
      </header>

      <section class="stats-grid" aria-label="Session Statistics">
        <div class="stat-card">
          <span class="stat-label">Best</span>
          <span id="stat-best" class="stat-value">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Ao5</span>
          <span id="stat-ao5" class="stat-value">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Ao12</span>
          <span id="stat-ao12" class="stat-value">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Mean (<span id="stat-count">0</span>)</span>
          <span id="stat-mean" class="stat-value">-</span>
        </div>
      </section>

      <section class="history-section">
        <div class="history-header">
          <span>Solves</span>
          <div class="history-actions">
            <button id="export-btn" class="btn-text" type="button" title="Export JSON">Export</button>
            <button id="clear-session-btn" class="btn-text" type="button" title="Clear current event solves">Clear</button>
          </div>
        </div>
        <ul id="solve-list" class="solve-list"></ul>
      </section>
    </aside>

    <main class="main-stage">
      <header class="top-bar">
        <div class="scramble-wrapper">
          <p id="scramble-text" class="scramble-text">Loading scramble...</p>
          <div class="scramble-controls">
            <span id="scramble-status" class="scramble-status"></span>
            <button id="new-scramble-btn" class="btn-outline" type="button">New Scramble</button>
            <button id="copy-scramble-btn" class="btn-outline" type="button">Copy</button>
          </div>
        </div>
        <button id="settings-btn" class="btn-icon" type="button" aria-label="Customize Settings" title="Customize">
          ⚙
        </button>
      </header>

      <section id="timer-zone" class="timer-zone" data-state="idle">
        <div id="timer-display" class="timer-display">0.00</div>
        <div id="timer-hint" class="timer-hint">Hold SPACE or CLICK to ready</div>

        <div id="last-solve-actions" class="last-solve-actions hidden">
          <button id="last-plus2-btn" class="btn-pill" type="button">+2</button>
          <button id="last-dnf-btn" class="btn-pill" type="button">DNF</button>
          <button id="last-del-btn" class="btn-pill" type="button">Delete</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="settings-title">Customize</h2>
        <button id="close-settings-btn" class="btn-icon" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Hold Delay: <strong id="hold-delay-value">300ms</strong></span>
          <input id="setting-hold-delay" type="range" min="0" max="800" step="50" />
        </label>

        <label class="field-row">
          <span>Decimal Precision</span>
          <select id="setting-decimals" class="select">
            <option value="2">2 (0.00)</option>
            <option value="3">3 (0.000)</option>
          </select>
        </label>

        <label class="field-row">
          <span>Focus Mode (hide UI while solving)</span>
          <input id="setting-focus-mode" type="checkbox" />
        </label>

        <label class="field">
          <span>Timer Size</span>
          <input id="setting-timer-size" type="range" min="4" max="12" step="0.5" />
        </label>

        <label class="field">
          <span>Scramble Size</span>
          <input id="setting-scramble-size" type="range" min="1" max="2.5" step="0.1" />
        </label>

        <div class="divider"></div>

        <label class="field-row">
          <span>Background</span>
          <input id="setting-bg-color" type="color" />
        </label>

        <label class="field-row">
          <span>Primary Text</span>
          <input id="setting-text-color" type="color" />
        </label>

        <label class="field-row">
          <span>Ready State Color</span>
          <input id="setting-ready-color" type="color" />
        </label>

        <button id="reset-theme-btn" class="btn-outline full-width" type="button">
          Reset to Monochrome Defaults
        </button>
      </div>
    </div>
  </div>

  <!-- Solve Detail Modal -->
  <div id="solve-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="solve-modal-time">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="solve-modal-time">0.00</h2>
        <button id="close-solve-modal-btn" class="btn-icon" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <p id="solve-modal-meta" class="muted-text"></p>
        <p id="solve-modal-scramble" class="solve-modal-scramble"></p>
        <div class="modal-actions">
          <button id="modal-plus2-btn" class="btn-outline" type="button">+2</button>
          <button id="modal-dnf-btn" class="btn-outline" type="button">DNF</button>
          <button id="modal-del-btn" class="btn-outline" type="button">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    let randomScrambleForEvent = null;

    const STORAGE_SOLVES_KEY = "mono_timer_solves_v1";
    const STORAGE_SETTINGS_KEY = "mono_timer_settings_v1";

    const DEFAULT_SETTINGS = {
      event: "333",
      holdDelayMs: 300,
      decimals: 2,
      focusMode: true,
      timerSize: 7.5,
      scrambleSize: 1.35,
      bgColor: "#0a0a0a",
      textColor: "#f5f5f5",
      readyColor: "#ffffff",
    };

    let settings = loadSettings();
    let solves = loadSolves();

    let timerState = "idle"; // "idle" | "holding" | "ready" | "running" | "stopping"
    let activeTrigger = null; // "space" | "pointer" | null
    let holdTimeoutId = null;
    let startTime = 0;
    let rafId = null;
    let suppressNextClick = false;

    let currentScramble = "";
    let prefetchedScramble = null;
    let prefetchedEvent = null;
    let selectedSolveId = null;

    const appEl = document.getElementById("app");
    const eventSelect = document.getElementById("event-select");
    const scrambleTextEl = document.getElementById("scramble-text");
    const scrambleStatusEl = document.getElementById("scramble-status");
    const newScrambleBtn = document.getElementById("new-scramble-btn");
    const copyScrambleBtn = document.getElementById("copy-scramble-btn");

    const timerZone = document.getElementById("timer-zone");
    const timerDisplay = document.getElementById("timer-display");
    const timerHint = document.getElementById("timer-hint");

    const lastSolveActions = document.getElementById("last-solve-actions");
    const lastPlus2Btn = document.getElementById("last-plus2-btn");
    const lastDnfBtn = document.getElementById("last-dnf-btn");
    const lastDelBtn = document.getElementById("last-del-btn");

    const statBestEl = document.getElementById("stat-best");
    const statAo5El = document.getElementById("stat-ao5");
    const statAo12El = document.getElementById("stat-ao12");
    const statMeanEl = document.getElementById("stat-mean");
    const statCountEl = document.getElementById("stat-count");
    const solveListEl = document.getElementById("solve-list");
    const clearSessionBtn = document.getElementById("clear-session-btn");
    const exportBtn = document.getElementById("export-btn");

    const settingsModal = document.getElementById("settings-modal");
    const settingsBtn = document.getElementById("settings-btn");
    const closeSettingsBtn = document.getElementById("close-settings-btn");

    const solveModal = document.getElementById("solve-modal");
    const closeSolveModalBtn = document.getElementById("close-solve-modal-btn");
    const solveModalTime = document.getElementById("solve-modal-time");
    const solveModalMeta = document.getElementById("solve-modal-meta");
    const solveModalScramble = document.getElementById("solve-modal-scramble");
    const modalPlus2Btn = document.getElementById("modal-plus2-btn");
    const modalDnfBtn = document.getElementById("modal-dnf-btn");
    const modalDelBtn = document.getElementById("modal-del-btn");

    const holdDelayInput = document.getElementById("setting-hold-delay");
    const holdDelayValue = document.getElementById("hold-delay-value");
    const decimalsSelect = document.getElementById("setting-decimals");
    const focusModeInput = document.getElementById("setting-focus-mode");
    const timerSizeInput = document.getElementById("setting-timer-size");
    const scrambleSizeInput = document.getElementById("setting-scramble-size");
    const bgColorInput = document.getElementById("setting-bg-color");
    const textColorInput = document.getElementById("setting-text-color");
    const readyColorInput = document.getElementById("setting-ready-color");
    const resetThemeBtn = document.getElementById("reset-theme-btn");

    async function init() {
      eventSelect.value = settings.event;
      applySettingsToUI();
      renderAll();

      try {
        const mod = await import("https://cdn.cubing.net/v0/js/cubing/scramble");
        randomScrambleForEvent = mod.randomScrambleForEvent;
        await loadNextScramble(settings.event);
      } catch (err) {
        console.error("Failed to load cubing/scramble:", err);
        scrambleTextEl.textContent =
          "Could not load WCA scrambler. Deploy to Vercel or serve over HTTPS/localhost.";
      }
    }

    async function generateScramble(eventId) {
      if (!randomScrambleForEvent) return "";
      const alg = await randomScrambleForEvent(eventId);
      return alg.toString();
    }

    async function loadNextScramble(eventId) {
      scrambleStatusEl.textContent = "Generating...";
      try {
        let scramble;
        if (prefetchedScramble && prefetchedEvent === eventId) {
          scramble = prefetchedScramble;
          prefetchedScramble = null;
          prefetchedEvent = null;
        } else {
          scramble = await generateScramble(eventId);
        }

        if (eventId === settings.event) {
          currentScramble = scramble;
          scrambleTextEl.textContent = currentScramble;
          scrambleStatusEl.textContent = "";
          prefetchScramble(eventId);
        }
      } catch (err) {
        console.error(err);
        scrambleStatusEl.textContent = "Scramble error";
      }
    }

    async function prefetchScramble(eventId) {
      try {
        const next = await generateScramble(eventId);
        if (eventId === settings.event) {
          prefetchedScramble = next;
          prefetchedEvent = eventId;
        }
      } catch {
        // Ignore background prefetch errors
      }
    }

    function setTimerState(nextState) {
      timerState = nextState;
      timerZone.dataset.state = nextState;

      if (nextState === "running" && settings.focusMode) {
        appEl.classList.add("is-running");
      } else {
        appEl.classList.remove("is-running");
      }

      if (nextState === "idle") {
        timerHint.textContent = "Hold SPACE or CLICK to ready";
      } else if (nextState === "holding") {
        timerHint.textContent = settings.holdDelayMs > 0 ? "Keep holding..." : "Release to start";
      } else if (nextState === "ready") {
        timerHint.textContent = "Release to start";
      } else if (nextState === "running") {
        timerHint.textContent = "";
      }
    }

    function beginHold(trigger) {
      if (timerState !== "idle") return;
      activeTrigger = trigger;
      clearTimeout(holdTimeoutId);

      if (settings.holdDelayMs <= 0) {
        setTimerState("ready");
        return;
      }

      setTimerState("holding");
      holdTimeoutId = setTimeout(() => {
        if (timerState === "holding") {
          setTimerState("ready");
        }
      }, settings.holdDelayMs);
    }

    function cancelHold() {
      clearTimeout(holdTimeoutId);
      holdTimeoutId = null;
      activeTrigger = null;
      setTimerState("idle");
    }

    function startTimer() {
      clearTimeout(holdTimeoutId);
      holdTimeoutId = null;
      activeTrigger = null;
      startTime = performance.now();
      setTimerState("running");
      lastSolveActions.classList.add("hidden");

      const tick = () => {
        if (timerState !== "running") return;
        const elapsed = performance.now() - startTime;
        timerDisplay.textContent = formatTime(elapsed, settings.decimals);
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }

    function stopTimer(stopTrigger) {
      const stopTime = performance.now();
      cancelAnimationFrame(rafId);
      rafId = null;

      const elapsedMs = Math.max(1, Math.round(stopTime - startTime));
      activeTrigger = stopTrigger;
      setTimerState("stopping");

      const solve = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        event: settings.event,
        rawMs: elapsedMs,
        penalty: null,
        scramble: currentScramble,
        createdAt: Date.now(),
      };

      solves.push(solve);
      saveSolves();

      timerDisplay.textContent = formatSolve(solve, settings.decimals);
      renderAll();
      loadNextScramble(settings.event);
    }

    function finishStopCycle() {
      if (timerState === "stopping") {
        activeTrigger = null;
        setTimerState("idle");
      }
    }

    function isModalOpen() {
      return !settingsModal.classList.contains("hidden") || !solveModal.classList.contains("hidden");
    }

    window.addEventListener("keydown", (e) => {
      if (isModalOpen()) {
        if (e.key === "Escape") closeModals();
        return;
      }

      if (e.code === "Space") {
        e.preventDefault();
        if (document.activeElement && document.activeElement !== document.body) {
          document.activeElement.blur();
        }
        if (e.repeat) return;

        if (timerState === "idle") {
          beginHold("space");
        } else if (timerState === "running") {
          stopTimer("space");
        }
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code !== "Space") return;
      e.preventDefault();

      if (timerState === "holding" && activeTrigger === "space") {
        cancelHold();
      } else if (timerState === "ready" && activeTrigger === "space") {
        startTimer();
      } else if (timerState === "stopping" && activeTrigger === "space") {
        finishStopCycle();
      }
    });

    window.addEventListener(
      "pointerdown",
      (e) => {
        if (timerState !== "running") return;
        if (e.pointerType === "mouse" && e.button !== 0) return;

        e.preventDefault();
        e.stopPropagation();
        suppressNextClick = true;
        setTimeout(() => {
          suppressNextClick = false;
        }, 100);
        stopTimer("pointer");
      },
      { capture: true }
    );

    window.addEventListener(
      "click",
      (e) => {
        if (suppressNextClick) {
          e.preventDefault();
          e.stopPropagation();
          suppressNextClick = false;
        }
      },
      { capture: true }
    );

    timerZone.addEventListener("pointerdown", (e) => {
      if (isModalOpen()) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.target.closest("button, select, input, a")) return;

      if (timerState === "idle") {
        e.preventDefault();
        beginHold("pointer");
      }
    });

    window.addEventListener("pointerup", () => {
      if (timerState === "holding" && activeTrigger === "pointer") {
        cancelHold();
      } else if (timerState === "ready" && activeTrigger === "pointer") {
        startTimer();
      } else if (timerState === "stopping" && activeTrigger === "pointer") {
        finishStopCycle();
      }
    });

    window.addEventListener("pointercancel", () => {
      if (timerState === "holding" || timerState === "ready") {
        cancelHold();
      } else if (timerState === "stopping") {
        finishStopCycle();
      }
    });

    window.addEventListener("blur", () => {
      if (timerState === "holding" || timerState === "ready") {
        cancelHold();
      } else if (timerState === "stopping") {
        finishStopCycle();
      }
    });

    function getEffectiveMs(solve) {
      if (solve.penalty === "DNF") return Infinity;
      if (solve.penalty === "+2") return solve.rawMs + 2000;
      return solve.rawMs;
    }

    function formatTime(ms, decimals = 2) {
      if (ms === Infinity || ms == null || Number.isNaN(ms)) return "DNF";
      const totalMs = Math.max(0, Math.round(ms));
      const minutes = Math.floor(totalMs / 60000);
      const seconds = Math.floor((totalMs % 60000) / 1000);
      const remMs = totalMs % 1000;
      const frac =
        decimals === 3
          ? String(remMs).padStart(3, "0")
          : String(Math.floor(remMs / 10)).padStart(2, "0");

      if (minutes > 0) {
        return `${minutes}:${String(seconds).padStart(2, "0")}.${frac}`;
      }
      return `${seconds}.${frac}`;
    }

    function formatSolve(solve, decimals = 2) {
      if (solve.penalty === "DNF") return "DNF";
      const base = formatTime(getEffectiveMs(solve), decimals);
      return solve.penalty === "+2" ? `${base}+` : base;
    }

    function calculateTrimmedAverage(list, size) {
      if (list.length < size) return null;
      const recent = list.slice(-size).map(getEffectiveMs);
      recent.sort((a, b) => (a === b ? 0 : a < b ? -1 : 1));
      const middle = recent.slice(1, size - 1);
      if (middle.some((t) => t === Infinity)) return Infinity;
      const sum = middle.reduce((acc, t) => acc + t, 0);
      return sum / middle.length;
    }

    function calculateSessionMean(list) {
      const valid = list.map(getEffectiveMs).filter((t) => t !== Infinity);
      if (valid.length === 0) return list.length > 0 ? Infinity : null;
      return valid.reduce((a, b) => a + b, 0) / valid.length;
    }

    function calculateBest(list) {
      const valid = list.map(getEffectiveMs).filter((t) => t !== Infinity);
      if (valid.length === 0) return list.length > 0 ? Infinity : null;
      return Math.min(...valid);
    }

    function getCurrentEventSolves() {
      return solves.filter((s) => s.event === settings.event);
    }

    function renderAll() {
      const eventSolves = getCurrentEventSolves();
      const dec = settings.decimals;

      const best = calculateBest(eventSolves);
      const ao5 = calculateTrimmedAverage(eventSolves, 5);
      const ao12 = calculateTrimmedAverage(eventSolves, 12);
      const mean = calculateSessionMean(eventSolves);

      statBestEl.textContent = best === null ? "-" : formatTime(best, dec);
      statAo5El.textContent = ao5 === null ? "-" : formatTime(ao5, dec);
      statAo12El.textContent = ao12 === null ? "-" : formatTime(ao12, dec);
      statMeanEl.textContent = mean === null ? "-" : formatTime(mean, dec);
      statCountEl.textContent = String(eventSolves.length);

      const latest = eventSolves[eventSolves.length - 1];
      if (latest && timerState !== "running") {
        lastSolveActions.classList.remove("hidden");
        lastPlus2Btn.classList.toggle("active", latest.penalty === "+2");
        lastDnfBtn.classList.toggle("active", latest.penalty === "DNF");
        if (timerState === "idle") {
          timerDisplay.textContent = formatSolve(latest, dec);
        }
      } else {
        lastSolveActions.classList.add("hidden");
        if (timerState === "idle") {
          timerDisplay.textContent = formatTime(0, dec);
        }
      }

      solveListEl.innerHTML = "";
      for (let i = eventSolves.length - 1; i >= 0; i--) {
        const solve = eventSolves[i];
        const li = document.createElement("li");
        li.className = "solve-item";
        li.innerHTML = `
          <span class="solve-index">${i + 1}.</span>
          <span class="solve-time">${formatSolve(solve, dec)}</span>
          <div class="solve-item-actions">
            <button class="mini-btn ${solve.penalty === "+2" ? "active" : ""}" data-act="+2" type="button">+2</button>
            <button class="mini-btn ${solve.penalty === "DNF" ? "active" : ""}" data-act="DNF" type="button">DNF</button>
            <button class="mini-btn" data-act="del" type="button">×</button>
          </div>
        `;

        li.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-act]");
          if (btn) {
            e.stopPropagation();
            const act = btn.dataset.act;
            if (act === "+2") togglePenalty(solve.id, "+2");
            if (act === "DNF") togglePenalty(solve.id, "DNF");
            if (act === "del") deleteSolve(solve.id);
            return;
          }
          openSolveModal(solve.id);
        });

        solveListEl.appendChild(li);
      }
    }

    function togglePenalty(id, penaltyType) {
      const solve = solves.find((s) => s.id === id);
      if (!solve) return;
      solve.penalty = solve.penalty === penaltyType ? null : penaltyType;
      saveSolves();
      renderAll();
      if (selectedSolveId === id) openSolveModal(id);
    }

    function deleteSolve(id) {
      solves = solves.filter((s) => s.id !== id);
      saveSolves();
      if (selectedSolveId === id) closeModals();
      renderAll();
    }

    eventSelect.addEventListener("change", () => {
      settings.event = eventSelect.value;
      eventSelect.blur();
      prefetchedScramble = null;
      prefetchedEvent = null;
      saveSettings();
      renderAll();
      loadNextScramble(settings.event);
    });

    newScrambleBtn.addEventListener("click", () => {
      newScrambleBtn.blur();
      loadNextScramble(settings.event);
    });

    copyScrambleBtn.addEventListener("click", async () => {
      copyScrambleBtn.blur();
      if (!currentScramble) return;
      try {
        await navigator.clipboard.writeText(currentScramble);
        const prev = copyScrambleBtn.textContent;
        copyScrambleBtn.textContent = "Copied";
        setTimeout(() => (copyScrambleBtn.textContent = prev), 900);
      } catch {
        // Clipboard blocked
      }
    });

    lastPlus2Btn.addEventListener("click", () => {
      const list = getCurrentEventSolves();
      const latest = list[list.length - 1];
      if (latest) togglePenalty(latest.id, "+2");
    });

    lastDnfBtn.addEventListener("click", () => {
      const list = getCurrentEventSolves();
      const latest = list[list.length - 1];
      if (latest) togglePenalty(latest.id, "DNF");
    });

    lastDelBtn.addEventListener("click", () => {
      const list = getCurrentEventSolves();
      const latest = list[list.length - 1];
      if (latest) deleteSolve(latest.id);
    });

    clearSessionBtn.addEventListener("click", () => {
      const list = getCurrentEventSolves();
      if (list.length === 0) return;
      if (!confirm(`Clear all ${list.length} solves for ${settings.event}?`)) return;
      solves = solves.filter((s) => s.event !== settings.event);
      saveSolves();
      renderAll();
    });

    exportBtn.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(solves, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cubing-solves-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    function openSolveModal(id) {
      const solve = solves.find((s) => s.id === id);
      if (!solve) return;
      selectedSolveId = id;
      solveModalTime.textContent = formatSolve(solve, settings.decimals);
      solveModalMeta.textContent = `${solve.event.toUpperCase()} • ${new Date(solve.createdAt).toLocaleString()}`;
      solveModalScramble.textContent = solve.scramble || "(no scramble recorded)";
      modalPlus2Btn.classList.toggle("active", solve.penalty === "+2");
      modalDnfBtn.classList.toggle("active", solve.penalty === "DNF");
      solveModal.classList.remove("hidden");
    }

    modalPlus2Btn.addEventListener("click", () => {
      if (selectedSolveId) togglePenalty(selectedSolveId, "+2");
    });
    modalDnfBtn.addEventListener("click", () => {
      if (selectedSolveId) togglePenalty(selectedSolveId, "DNF");
    });
    modalDelBtn.addEventListener("click", () => {
      if (selectedSolveId) deleteSolve(selectedSolveId);
    });
    closeSolveModalBtn.addEventListener("click", closeModals);

    settingsBtn.addEventListener("click", () => {
      settingsModal.classList.remove("hidden");
    });
    closeSettingsBtn.addEventListener("click", closeModals);

    [settingsModal, solveModal].forEach((modal) => {
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModals();
      });
    });

    function closeModals() {
      settingsModal.classList.add("hidden");
      solveModal.classList.add("hidden");
      selectedSolveId = null;
    }

    function applySettingsToUI() {
      const root = document.documentElement.style;
      root.setProperty("--bg-primary", settings.bgColor);
      root.setProperty("--text-primary", settings.textColor);
      root.setProperty("--state-ready", settings.readyColor);
      root.setProperty("--timer-size", `${settings.timerSize}rem`);
      root.setProperty("--scramble-size", `${settings.scrambleSize}rem`);

      holdDelayInput.value = settings.holdDelayMs;
      holdDelayValue.textContent = `${settings.holdDelayMs}ms`;
      decimalsSelect.value = String(settings.decimals);
      focusModeInput.checked = settings.focusMode;
      timerSizeInput.value = settings.timerSize;
      scrambleSizeInput.value = settings.scrambleSize;
      bgColorInput.value = settings.bgColor;
      textColorInput.value = settings.textColor;
      readyColorInput.value = settings.readyColor;
    }

    function updateSetting(key, value) {
      settings[key] = value;
      saveSettings();
      applySettingsToUI();
      renderAll();
    }

    holdDelayInput.addEventListener("input", () => updateSetting("holdDelayMs", Number(holdDelayInput.value)));
    decimalsSelect.addEventListener("change", () => updateSetting("decimals", Number(decimalsSelect.value)));
    focusModeInput.addEventListener("change", () => updateSetting("focusMode", focusModeInput.checked));
    timerSizeInput.addEventListener("input", () => updateSetting("timerSize", Number(timerSizeInput.value)));
    scrambleSizeInput.addEventListener("input", () => updateSetting("scrambleSize", Number(scrambleSizeInput.value)));
    bgColorInput.addEventListener("input", () => updateSetting("bgColor", bgColorInput.value));
    textColorInput.addEventListener("input", () => updateSetting("textColor", bgColorInput.value));
    readyColorInput.addEventListener("input", () => updateSetting("readyColor", readyColorInput.value));

    resetThemeBtn.addEventListener("click", () => {
      const currentEvent = settings.event;
      settings = { ...DEFAULT_SETTINGS, event: currentEvent };
      saveSettings();
      applySettingsToUI();
      renderAll();
    });

    function loadSolves() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_SOLVES_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveSolves() {
      localStorage.setItem(STORAGE_SOLVES_KEY, JSON.stringify(solves));
    }

    function loadSettings() {
      try {
        return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(STORAGE_SETTINGS_KEY)) };
      } catch {
        return { ...DEFAULT_SETTINGS };
      }
    }

    function saveSettings() {
      localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(settings));
    }

    init();
  </script>
</body>
</html>
